<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wesstyle Tactical Football - Online</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .ui { text-align: center; padding: 5px 0; width: 100%; background: rgba(0,0,0,0.8); border-bottom: 1px solid #333; }
        .score { font-size: 24px; font-weight: bold; letter-spacing: 3px; margin: 0; }
        .stamina-bar-container { width: 150px; height: 5px; background: #222; margin: 4px auto; border-radius: 3px; overflow: hidden; }
        #stamina-fill { width: 100%; height: 100%; background: #00ff88; transition: width 0.1s linear; }
        #status { font-size: 10px; color: #f0f; margin-top: 2px; }
        #game-container { position: relative; width: 98vw; height: 85vh; max-width: 1280px; display: flex; justify-content: center; align-items: center; margin-top: 5px; }
        canvas { background-color: #0d0d0d; border: 2px solid #333; width: 100%; height: 100%; object-fit: contain; cursor: crosshair; }
    </style>
</head>
<body>
    <div class="ui">
        <p class="score" id="scoreboard">0 - 0</p>
        <div class="stamina-bar-container"><div id="stamina-fill"></div></div>
        <div id="status">Conectando al servidor...</div>
    </div>
    <div id="game-container"><canvas id="gameCanvas"></canvas></div>

<script>
// --- CONFIGURACIÓN DE RED ---
const RENDER_URL = "https://tu-juego.onrender.com"; // CAMBIA ESTO POR TU URL DE RENDER
const socket = io(RENDER_URL);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreboard');
const staminaFill = document.getElementById('stamina-fill');
const statusEl = document.getElementById('status');

const V_WIDTH = 1280, V_HEIGHT = 600;
canvas.width = V_WIDTH; canvas.height = V_HEIGHT;

// --- FÍSICAS (Tus parámetros originales) ---
const FRICTION = 0.89, BALL_FRICTION = 0.988;
const ACCEL_WALK = 0.38, ACCEL_SPRINT = 0.85; 
const MAX_WALK = 3.8, MAX_SPRINT = 7.2;
const PITCH_MARGIN = 45, PLAYER_RADIUS = 16, BALL_RADIUS = 10; 
const GOAL_Y_TOP = 230, GOAL_Y_BOT = 370;

let myId, myTeam, stamina = 100;
let remotePlayers = {};
let keys = {}, mouse = { x: 0, y: 0 };

// --- CLASES ---
class Ball {
    constructor() { this.x = V_WIDTH/2; this.y = V_HEIGHT/2; this.vx = 0; this.vy = 0; }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vx *= BALL_FRICTION; this.vy *= BALL_FRICTION;
        if (this.y - BALL_RADIUS < PITCH_MARGIN || this.y + BALL_RADIUS > V_HEIGHT - PITCH_MARGIN) this.vy *= -0.7;
    }
    draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = "#fff"; ctx.fill(); ctx.stroke();
    }
}

class Player {
    constructor(x, y, team) {
        this.x = x; this.y = y; this.team = team; this.vx = 0; this.vy = 0; this.rot = 0;
    }
    update() {
        let isSprinting = (keys['ShiftLeft'] || keys['ShiftRight']) && stamina > 10;
        const accel = isSprinting ? ACCEL_SPRINT : ACCEL_WALK;
        const maxS = isSprinting ? MAX_SPRINT : MAX_WALK;

        if (keys['KeyW']) this.vy -= accel; if (keys['KeyS']) this.vy += accel;
        if (keys['KeyA']) this.vx -= accel; if (keys['KeyD']) this.vx += accel;

        stamina = isSprinting ? Math.max(0, stamina - 1.5) : Math.min(100, stamina + 0.5);
        staminaFill.style.width = stamina + "%";

        let s = Math.hypot(this.vx, this.vy);
        if (s > maxS) { this.vx = (this.vx/s)*maxS; this.vy = (this.vy/s)*maxS; }
        
        this.x += this.vx; this.y += this.vy;
        this.vx *= FRICTION; this.vy *= FRICTION;
        this.rot = Math.atan2(mouse.y - this.y, mouse.x - this.x);
    }
    draw(isLocal = false) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
        ctx.beginPath(); ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = this.team === 'local' ? '#25f' : '#f22'; ctx.fill();
        ctx.strokeStyle = isLocal ? "#fff" : "#333"; ctx.lineWidth = 3; ctx.stroke();
        ctx.restore();
    }
}

const ball = new Ball();
const localPlayer = new Player(300, 300, 'local');

// --- SOCKET EVENTS ---
socket.on('init', data => {
    myId = data.id; myTeam = data.team;
    localPlayer.team = myTeam;
    statusEl.innerText = "Conectado - Equipo: " + myTeam.toUpperCase();
});

socket.on('update', state => {
    remotePlayers = state.players;
    // Solo actualizamos la pelota si no somos nosotros los que la estamos moviendo (para evitar tirones)
    const dist = Math.hypot(ball.x - localPlayer.x, ball.y - localPlayer.y);
    if (dist > 50) {
        ball.x = state.ball.x; ball.y = state.ball.y;
    }
});

// --- LOOP PRINCIPAL ---
function loop() {
    ctx.fillStyle = "#111"; ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
    
    if (myId) {
        localPlayer.update();
        ball.update();

        // Enviar datos al servidor
        socket.emit('pInput', {
            x: localPlayer.x, y: localPlayer.y, rot: localPlayer.rot,
            ballUpdate: (Math.hypot(ball.x - localPlayer.x, ball.y - localPlayer.y) < 40) ? 
                        { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy } : null
        });

        // Dibujar campo y pelota
        ball.draw();

        // Dibujar otros jugadores
        for (let id in remotePlayers) {
            if (id !== myId) {
                const p = remotePlayers[id];
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                ctx.beginPath(); ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = p.team === 'local' ? '#25f' : '#f22'; ctx.fill();
                ctx.stroke(); ctx.restore();
            }
        }
        localPlayer.draw(true);
    }

    requestAnimationFrame(loop);
}

// Inputs (resumidos para el ejemplo)
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;
window.onmousemove = e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) * (V_WIDTH / rect.width);
    mouse.y = (e.clientY - rect.top) * (V_HEIGHT / rect.height);
};

loop();
</script>
</body>
</html>
